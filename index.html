<body>
<title>Taameem</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">

<script>window.tailwind && (tailwind.config = { corePlugins: { preflight: true } });</script>
<style>
:root{color-scheme:light;--navy:#0F2237;--navy2:#16304A;--green:#119A78;--green2:#0B6F62;--teal:#7FD8C0;--mint:#DDF2EA;--cream:#F6F4EE;--paper:#FFFFFF;--paper2:#FBFAF6;--paper3:#F1EEE6;--chipbg:#EEEBE3;--navySoft:#E3E9F6;--ink:#14213A;--ink2:#4A5570;--muted:#7C8599;--line:#E3DFD5;--coral:#B8412F;--coralSoft:#FBE9E7;--gold:#B8892B;--goldSoft:#FBF0D3;--blue:#2F6BFF;--chrome:#0A1626;--dots:rgba(15,34,55,.07);--glow:rgba(17,154,120,.12);--onnavy:#DCE6F2}
html[data-theme="dark"]{color-scheme:dark;--navy:#0B1A2C;--navy2:#13273F;--green:#1FA69C;--green2:#6FE0D8;--teal:#7FD8C0;--mint:#0F2E2C;--cream:#0A1220;--paper:#111C2E;--paper2:#0F1929;--paper3:#162338;--chipbg:#1B2A42;--navySoft:#1A2A46;--ink:#E7ECF5;--ink2:#B4BDD0;--muted:#8896AE;--line:#22304A;--coral:#F19A8A;--coralSoft:#3A1B19;--gold:#E3B34F;--goldSoft:#3A2E12;--chrome:#060C16;--dots:rgba(157,178,255,.08);--glow:rgba(31,166,156,.18);--onnavy:#DCE6F2}
html[data-theme="dark"] .top{background:#060C16}
html[data-theme="dark"] .guide{background:linear-gradient(135deg,#13273F,#1A3350);box-shadow:none;border:1px solid #22304A}
html[data-theme="dark"] .log{background:#050B14;border:1px solid #22304A}
html[data-theme="dark"] .report::before{opacity:.8}
html[data-theme="dark"] .doc .cl.hl{background:#5A4A12;color:#fff}
html[data-theme="dark"] .diff mark{background:#5A4A12;color:#fff}
html[data-theme="dark"] .diff .before{background:#2A1614;border-color:#4A2622}html[data-theme="dark"] .diff .after{background:#0F2E2C;border-color:#1F4A45}
html[data-theme="dark"] .card,html[data-theme="dark"] .msg,html[data-theme="dark"] .ev,html[data-theme="dark"] .stp,html[data-theme="dark"] .report{box-shadow:0 14px 34px -26px rgba(0,0,0,.8)}
html[data-theme="dark"] .rep-head{border-bottom-color:var(--green)}html[data-theme="dark"] .rep-title{color:var(--ink)}
html[data-theme="dark"] .top .role button.on{color:#04211F}
html[data-theme="dark"] .pill.navy{background:var(--navySoft);color:#9DB2FF}
html[data-theme="dark"] .btn.navy{background:var(--green2);border-color:var(--green2);color:#04211F}
html[data-theme="dark"] .node.ob{background:var(--green2);color:#04211F;border-color:var(--green2)}
html[data-theme="dark"] .mod.must{background:var(--navySoft);color:#9DB2FF}
html[data-theme="dark"] .who.hu{background:#1A2A46;color:#9DB2FF}
html[data-theme="dark"] .guide .who.hu{background:#2A3F63;color:#C9D6FF}
html[data-theme="dark"] .logo-dark{display:none}
html:not([data-theme="dark"]) .logo-light{display:none}
*{transition:background-color .25s,border-color .25s,color .15s}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--cream);color:var(--ink);font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
#root{height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate}
.svgi{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.15em}
.btn .svgi,.pill .svgi{width:.95em;height:.95em}
.ibtn .svgi{width:1.1rem;height:1.1rem}
.mode{display:inline-flex;background:var(--chipbg);border-radius:999px;padding:3px;gap:2px}
.mode button{display:inline-flex;align-items:center;gap:.35rem;padding:.32rem .8rem;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.mode button.on{background:var(--green);color:#04211F}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl;unicode-bidi:isolate;text-align:right}
.app{height:100%;display:grid;grid-template-columns:250px 1fr;grid-template-rows:56px 1fr}
.app.simple{grid-template-columns:1fr}
.app.simple .side{display:none}
.app.simple .main::before,.app.simple .wm-bg{inset:56px 0 0 0}
.app.simple .mode,.app.simple .h p{display:none}
.app.simple .main{padding-top:0}
.strip{position:sticky;top:0;z-index:5;margin:0 -1.6rem 1.2rem;padding:.9rem 1.6rem .7rem;background:linear-gradient(180deg,var(--cream) 78%,transparent);display:grid;grid-template-columns:auto repeat(7,1fr);gap:.4rem;align-items:start}
.strip .home{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:0 .6rem 0 0;border-inline-end:1px solid var(--line);margin-inline-end:.4rem;color:var(--muted);font-size:.7rem;font-weight:600}
.strip .step{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;position:relative;padding-top:2px}
.strip .step::before{content:"";position:absolute;top:22px;left:50%;width:100%;height:0;border-top:2px dashed var(--green);opacity:.55;z-index:0}
.strip .step:last-child::before{display:none}
.strip .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid var(--cream);box-shadow:0 8px 18px -10px rgba(15,34,55,.6);position:relative;z-index:1;transition:transform .2s}
.strip .c .svgi{width:20px;height:20px}
.strip .c.ai{background:var(--green)}.strip .c.hu{background:var(--navy)}.strip .c.rd{background:var(--gold)}.strip .c.sys{background:#7C8599}
.strip .step.on .c{transform:scale(1.15);box-shadow:0 0 0 4px var(--mint),0 10px 22px -10px rgba(15,34,55,.6)}
.strip .step.done .c{background:var(--green)}
.strip .t{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:.86rem;line-height:1.15;color:var(--ink2)}
html[dir="rtl"] .strip .t{font-family:"Noto Kufi Arabic",sans-serif;font-size:.8rem}
.strip .step.on .t{color:var(--ink)}
.strip .n{position:absolute;top:-4px;inset-inline-end:calc(50% - 30px);background:var(--paper);color:var(--ink2);font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:700;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;border:1px solid var(--line);z-index:2}
.strip .home .c{background:var(--paper);color:var(--ink2);border-color:var(--line)}
.strip .step:hover .c{transform:scale(1.08)}
.sguide{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;background:linear-gradient(135deg,#0F2237,#16304A);color:var(--onnavy);border-radius:14px;padding:.85rem 1.1rem;margin-bottom:1rem;box-shadow:0 20px 40px -26px rgba(15,34,55,.7)}
.sguide .big{font-size:1.02rem;line-height:1.45;color:#fff}
.sguide .ex{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--teal);margin-top:.25rem}
.sguide .ex b{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#9DB0C4;font-weight:700}
html[dir="rtl"] .sguide .ex b{letter-spacing:0}
.sguide .do{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:.5rem .8rem;font-size:.82rem;max-width:26ch;color:#fff}
.sguide .do b{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
html[dir="rtl"] .sguide .do b{letter-spacing:0}
.nextfab{position:fixed;bottom:1.2rem;inset-inline-end:1.2rem;z-index:40;display:flex;gap:.5rem}
.nextfab .btn{box-shadow:0 18px 40px -18px rgba(15,34,55,.7)}
.topbar-line{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green),var(--teal));opacity:.9}
@media(max-width:900px){.strip{grid-template-columns:auto repeat(7,1fr);gap:.2rem}.strip .t{display:none}.sguide{grid-template-columns:1fr}.sguide .do{max-width:none}}
.top{grid-column:1/-1;display:flex;align-items:center;gap:1rem;padding:0 1.1rem;background:var(--navy);color:var(--onnavy);position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 90% 0%,rgba(31,166,156,.35),transparent 60%);pointer-events:none}
.top>*{position:relative}
.top img{height:26px}
.top .role{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.top .role button{padding:.3rem .8rem;border-radius:999px;font-size:.78rem;font-weight:600;color:#B9C6D6}
.top .role button.on{background:var(--green);color:#04211F}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.green{background:var(--mint);color:var(--green2)}.pill.gold{background:var(--goldSoft);color:var(--gold)}.pill.coral{background:var(--coralSoft);color:var(--coral)}.pill.navy{background:var(--navySoft);color:var(--navy)}.pill.grey{background:var(--chipbg);color:var(--ink2)}.pill.outline{border-color:rgba(255,255,255,.25);color:var(--onnavy)}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .95rem;border-radius:10px;font-size:.84rem;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(15,34,55,.4)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.pri:hover{background:#0F8C6D}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:.35rem .65rem;font-size:.76rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.side{background:var(--paper);border-inline-end:1px solid var(--line);padding:1rem .8rem;display:flex;flex-direction:column;gap:.25rem;overflow:auto;grid-column:1;grid-row:2}
.side .lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.6rem .6rem .3rem}
html[dir="rtl"] .side .lbl{letter-spacing:0}
.nav{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:10px;font-size:.86rem;color:var(--ink2);text-align:start;width:100%}
.nav:hover{background:var(--cream)}
.nav.on{background:var(--mint);color:var(--green2);font-weight:600}
.nav .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:.7rem;border:1.5px solid var(--line);flex:none;background:var(--paper)}
.nav.on .n{border-color:var(--green);color:var(--green2)}
.nav.done .n{background:var(--green);border-color:var(--green);color:#fff}
.nav .st{margin-inline-start:auto;font-size:.66rem;color:var(--muted)}
.main{overflow:auto;padding:1.4rem 1.6rem 3rem;position:relative;grid-column:2;grid-row:2}
.app.simple .main{grid-column:1}
.main::before{content:"";position:fixed;inset:56px 0 0 250px;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 100% -5%,var(--glow),transparent 62%),radial-gradient(700px 500px at -5% 105%,rgba(15,34,55,.10),transparent 60%),radial-gradient(var(--dots) 1px,transparent 1.3px) 0 0/22px 22px}
html[dir="rtl"] .main::before{inset:56px 250px 0 0;background:radial-gradient(900px 520px at 0% -5%,var(--glow),transparent 62%),radial-gradient(700px 500px at 105% 105%,rgba(15,34,55,.10),transparent 60%),radial-gradient(var(--dots) 1px,transparent 1.3px) 0 0/22px 22px}
html[data-theme="dark"] .main::before{background:radial-gradient(900px 620px at 100% -10%,rgba(31,166,156,.30),rgba(17,154,120,.08) 45%,transparent 70%),radial-gradient(700px 520px at -5% 105%,rgba(47,107,255,.14),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 1px,transparent 1px 15px),radial-gradient(var(--dots) 1px,transparent 1.3px) 0 0/22px 22px}
html[data-theme="dark"][dir="rtl"] .main::before{background:radial-gradient(900px 620px at 0% -10%,rgba(31,166,156,.30),rgba(17,154,120,.08) 45%,transparent 70%),radial-gradient(700px 520px at 105% 105%,rgba(47,107,255,.14),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 15px),radial-gradient(var(--dots) 1px,transparent 1.3px) 0 0/22px 22px}
.wm-bg{position:fixed;inset:56px 0 0 250px;pointer-events:none;z-index:0;overflow:hidden}
html[dir="rtl"] .wm-bg{inset:56px 250px 0 0}
.side-backdrop{display:none}
.wm-bg,.nextfab,.toast{grid-column:1;grid-row:1;justify-self:start;align-self:start}
.wm-bg img{position:absolute;right:-90px;bottom:-140px;height:min(72vh,720px);width:auto;opacity:.09;transform:rotate(-8deg);filter:saturate(.9)}
html[dir="rtl"] .wm-bg img{right:auto;left:-90px;transform:rotate(8deg) scaleX(-1)}
html[data-theme="dark"] .wm-bg img{opacity:.13}
.wm-bg .wm-word{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);height:min(22vh,190px);opacity:.035;filter:grayscale(1)}
html[data-theme="dark"] .wm-bg .wm-word{opacity:.05}
.wm-bg .glow-orb{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(31,166,156,.28),rgba(31,166,156,0) 62%);filter:blur(28px);right:-220px;top:-320px;animation:drift 18s ease-in-out infinite alternate;display:none}
html[data-theme="dark"] .wm-bg .glow-orb{display:block}
html[dir="rtl"] .wm-bg .glow-orb{right:auto;left:-220px}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-110px,80px)}}
.main>*{position:relative;z-index:1}
.card,.msg,.ev,.stp,.tier,.report{box-shadow:0 14px 34px -26px rgba(15,34,55,.35)}
@media (prefers-reduced-motion:reduce){.glow-orb{animation:none}}
.main>*{position:relative;z-index:1}
.h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.h h1{font-family:Fraunces,Georgia,serif;font-size:1.7rem;font-weight:600;margin:0;line-height:1.15;letter-spacing:-.01em}
html[dir="rtl"] .h h1{font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;font-size:1.45rem}
.h p{margin:.3rem 0 0;color:var(--ink2);max-width:70ch}
.kick{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700;display:flex;align-items:center;gap:.5rem}
.kick::before{content:"";width:18px;height:2px;background:var(--green)}
html[dir="rtl"] .kick{letter-spacing:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;box-shadow:0 14px 34px -26px rgba(15,34,55,.4)}
.card h3{margin:0 0 .6rem;font-size:.95rem;font-weight:700}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:grid;gap:.15rem}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:1.6rem;color:var(--green2);line-height:1.1;direction:ltr;unicode-bidi:isolate;text-align:start}
.stat span{font-size:.8rem;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:start;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
html[dir="rtl"] th{letter-spacing:0}
td{padding:.6rem .6rem;border-bottom:1px solid var(--chipbg);vertical-align:top}
tr.sel td{background:var(--mint)}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F5F0}
.conf{font-family:"IBM Plex Mono",monospace;font-size:.75rem;padding:.1rem .5rem;border-radius:999px;background:var(--mint);color:var(--green2);font-weight:600;direction:ltr;display:inline-block}
.conf.low{background:var(--goldSoft);color:var(--gold)}
.mod{font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:6px;letter-spacing:.04em}
.mod.must{background:var(--navySoft);color:var(--navy)}.mod.must_not{background:var(--coralSoft);color:var(--coral)}.mod.may{background:var(--chipbg);color:var(--ink2)}
.doc{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl;text-align:right;line-height:2;font-size:.95rem;position:relative}
.doc .ref{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);direction:ltr;text-align:left;display:block;margin-bottom:.4rem}
.doc .cl{padding:.15rem .4rem;border-radius:6px;transition:background .3s}
.doc .cl.hl{background:#FFE9A8}
.doc .cl.dim{opacity:.55}
.doc .stamp{position:absolute;left:14px;bottom:12px;border:2px solid var(--coral);color:var(--coral);border-radius:6px;padding:.1rem .5rem;font-size:.7rem;font-weight:700;transform:rotate(-8deg);opacity:.7;font-family:Inter,sans-serif;direction:ltr}
.log{background:var(--navy);color:var(--onnavy);border-radius:12px;padding:.9rem 1rem;font-family:"IBM Plex Mono",monospace;font-size:.76rem;line-height:1.7;min-height:120px;direction:ltr;text-align:left}
.log .ok{color:var(--teal)}.log .warn{color:#E3B34F}.log .dim{color:#8FA3BA}
.prog{height:6px;background:#1F3350;border-radius:3px;overflow:hidden;margin:.5rem 0}
.prog i{display:block;height:100%;background:var(--green);transition:width .35s}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
.stp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.8rem .8rem;display:grid;gap:.3rem;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s}
.stp:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(15,34,55,.4)}
.stp .n{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--muted)}
.stp b{font-size:.86rem}
.stp small{color:var(--ink2);font-size:.74rem;line-height:1.3}
.stp.done{border-color:var(--green);background:var(--mint)}
.stp.cur{border-color:var(--navy);box-shadow:0 0 0 3px var(--navySoft)}
.stp.road{border-style:dashed;border-color:var(--gold)}
.stp .who{position:absolute;top:.6rem;inset-inline-end:.6rem;font-size:.62rem;font-weight:700;padding:.1rem .4rem;border-radius:999px}
.who.ai{background:var(--mint);color:var(--green2)}.who.hu{background:var(--navySoft);color:var(--navy)}.who.rd{background:var(--goldSoft);color:var(--gold)}
.inbox{display:grid;gap:.5rem}
.msg{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;padding:.8rem .9rem;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.msg.new{border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
.msg .src{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:700;color:#fff}
.src.sama{background:var(--navy)}.src.cma{background:var(--green2)}.src.ia{background:var(--gold)}
.msg b{display:block;font-size:.9rem}
.msg small{color:var(--muted);font-size:.74rem}
.maprow{display:grid;grid-template-columns:90px 1fr;gap:.5rem;padding:.45rem 0;border-bottom:1px dashed var(--line);font-size:.84rem;align-items:baseline}
.maprow b{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green2)}
html[dir="rtl"] .maprow b{letter-spacing:0}
.gap{display:inline-flex;gap:.4rem;align-items:center;font-size:.74rem;font-weight:700;padding:.2rem .6rem;border-radius:999px}
.gap.high{background:var(--coralSoft);color:var(--coral)}.gap.medium{background:var(--goldSoft);color:var(--gold)}.gap.low{background:var(--mint);color:var(--green2)}.gap.none{background:var(--chipbg);color:var(--ink2)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.diff>div{border-radius:10px;padding:.8rem .9rem;font-size:.84rem;line-height:1.6}

.ev .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--chipbg);font-size:.66rem;font-weight:700;color:var(--ink2);font-family:"IBM Plex Mono",monospace}
.ev .hash{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);direction:ltr;text-align:left;word-break:break-all}
.bar{height:8px;background:var(--chipbg);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .a{background:var(--green)}.bar .b{background:var(--gold)}.bar .c{background:var(--coral)}
.toast{position:fixed;bottom:1.2rem;inset-inline-end:1.2rem;background:var(--navy);color:#fff;padding:.7rem 1rem;border-radius:12px;font-size:.84rem;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);z-index:50;display:flex;gap:.6rem;align-items:center;animation:up .3s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.graph{position:relative;height:260px}
.node{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.4rem .7rem;font-size:.76rem;font-weight:600;text-align:center;box-shadow:0 8px 20px -14px rgba(15,34,55,.4);min-width:120px}
.node.ob{background:var(--navy);color:#fff;border-color:var(--navy)}
.node.gap{border-color:var(--coral);background:var(--coralSoft)}
.node small{display:block;font-weight:500;color:var(--muted);font-size:.66rem}
.node.ob small{color:#B9C6D6}
.sup{border:1px dashed var(--gold);background:var(--goldSoft);border-radius:12px;padding:.7rem .9rem;font-size:.82rem;color:var(--ink2);display:flex;gap:.6rem;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.report{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1.6rem 1.8rem;box-shadow:0 20px 50px -30px rgba(15,34,55,.5);font-size:.9rem;position:relative}
.report::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--green),var(--navy));border-radius:6px 6px 0 0}
.rep-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:.8rem;border-bottom:2px solid var(--navy);margin-bottom:.8rem}
.rep-title{font-family:Fraunces,"Noto Kufi Arabic",Georgia,serif;font-size:1.3rem;font-weight:700;color:var(--navy)}
.rep-meta{display:grid;gap:.15rem;font-size:.84rem;color:var(--ink2);margin-bottom:.9rem}
.rep-intro{line-height:1.7;margin:0 0 1rem}
.rep-table{font-size:.84rem;margin-bottom:1rem}
.rep-table th{background:var(--paper3)}
.rep-table .hash{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--muted);direction:ltr;text-align:left}
.rep-sign{display:flex;justify-content:space-between;gap:1rem;align-items:flex-end;border-top:1px dashed var(--line);padding-top:.8rem}
.rep-note{font-size:.72rem;color:var(--muted);max-width:40ch;text-align:end}
.sentbox{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--mint);border:1px solid #BFE5D8;border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;font-size:.86rem;color:var(--green2)}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;inset:0;box-shadow:none;border:0}.main::before{display:none}}
.guide{display:grid;grid-template-columns:auto 1fr 1fr;gap:1.2rem;align-items:start;background:linear-gradient(135deg,#0F2237,#16304A);color:var(--onnavy);border-radius:14px;padding:.95rem 1.2rem;margin-bottom:1.1rem;box-shadow:0 20px 40px -26px rgba(15,34,55,.7)}
.guide .gw{display:flex;align-items:center;height:100%}
.guide .gw .who{font-size:.74rem;padding:.35rem .7rem;white-space:nowrap}
.guide .gt{display:grid;gap:.15rem;font-size:.86rem;line-height:1.55}
.guide .gt b{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
html[dir="rtl"] .guide .gt b{letter-spacing:0;font-size:.74rem}
.guide .gt.next{border-inline-start:1px solid rgba(255,255,255,.15);padding-inline-start:1.2rem}
.guide .gt.next span{color:#fff;font-weight:600}
@media(max-width:1000px){.guide{grid-template-columns:1fr}.guide .gt.next{border:0;padding:0}}
select,input[type=text]{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.lock{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--coral);font-weight:700}
.btn:active{transform:scale(.97)}
.ibtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--onnavy);position:relative;font-size:1rem}
.ibtn:hover{background:rgba(255,255,255,.16)}
.badge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--coral);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.npanel{position:fixed;top:62px;inset-inline-end:1rem;width:360px;max-height:65vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);z-index:60;animation:up .25s ease}
.npanel h4{margin:0;padding:.75rem .9rem;border-bottom:1px solid var(--line);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
html[dir="rtl"] .npanel h4{letter-spacing:0}
.nitem{padding:.6rem .9rem;border-bottom:1px solid var(--line);font-size:.83rem;display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start}
.nitem i{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:.45rem}
.nitem.unread i{background:var(--green)}
.nitem small{display:block;color:var(--muted);font-size:.7rem;margin-top:.1rem}
.stagger>*{animation:fade .45s ease both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(6){animation-delay:.3s}.stagger>*:nth-child(7){animation-delay:.36s}.stagger>*:nth-child(8){animation-delay:.42s}
.sprog{height:5px;background:var(--chipbg);border-radius:3px;margin:.3rem .6rem .8rem;overflow:hidden}
.sprog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:.66rem;padding:.05rem .3rem;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fade,.stagger>*,.toast,.npanel{animation:none!important}}
